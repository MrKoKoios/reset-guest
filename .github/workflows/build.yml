name: Build FF Guest Reseter

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Compile EXE
      run: |
        $csc = "C:\Windows\Microsoft.NET\Framework\v4.0.30319\csc.exe"
        & $csc /target:winexe /out:FF_Guest_Reseter.exe /r:System.Windows.Forms.dll /r:System.Drawing.dll GuestReseter.cs
      shell: pwsh

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: FF-Guest-Reseter
        path: FF_Guest_Reseter.exe
        retention-days: 7
